<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#005030" />
  <meta name="description" content="ReportFlow — Operational reporting and compliance coordination system for GVE mini-grid field engineers." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ReportFlow" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>ReportFlow — Mini-Grid Field Reporting</title>
  <!-- Inline theme init: must run synchronously before CSS paint to avoid flash -->
  <script>
    try {
      if (localStorage.getItem("reportflow_sunlight_mode") === "true") {
        document.documentElement.classList.add("sunlight-mode");
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
